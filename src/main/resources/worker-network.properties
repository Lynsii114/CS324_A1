# Worker Node network configuration.
#
# Each entry describes one Worker Node that WorkerLauncher starts as its own
# independent JVM process communicating over Java RMI. The six workers are
# assigned IDs 1 through 6, and every worker owns a dedicated RMI registry
# port so the processes are fully isolated from each other.
#
# Edit the ports/hosts here to change how the six-worker network is laid out.

worker.1.id=1
worker.1.host=localhost
worker.1.port=5001

worker.2.id=2
worker.2.host=localhost
worker.2.port=5002

worker.3.id=3
worker.3.host=localhost
worker.3.port=5003

worker.4.id=4
worker.4.host=localhost
worker.4.port=5004

worker.5.id=5
worker.5.host=localhost
worker.5.port=5005

worker.6.id=6
worker.6.host=localhost
worker.6.port=5006